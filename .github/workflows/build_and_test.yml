name: Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: hypertube-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtorrent-rasterbar-dev libcurl4-openssl-dev libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 libwayland-dev libx11-xcb-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev nlohmann-json3-dev ninja-build xvfb

    - name: Configure CMake
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --target hypertube unit_tests config_tests search_tests torrent_tests slint_model_tests slint_controller_tests slint-preview-check --parallel 2

    - name: Test
      run: xvfb-run -a ctest --test-dir build --output-on-failure --parallel 2

  macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: brew install boost libtorrent-rasterbar curl nlohmann-json ninja pkg-config

    - name: Configure CMake
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --target hypertube unit_tests config_tests search_tests torrent_tests slint_model_tests slint_controller_tests slint-preview-check --parallel 2

    - name: Test
      run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache

    steps:
    - uses: actions/checkout@v4

    - name: Restore vcpkg binaries cache
      id: cache-vcpkg-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}-
          vcpkg-${{ runner.os }}-${{ runner.arch }}-

    - name: Create vcpkg cache directory
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

    - name: Install dependencies
      shell: pwsh
      run: vcpkg install libtorrent curl nlohmann-json --triplet x64-windows

    - name: Save vcpkg binaries cache
      uses: actions/cache/save@v4
      if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}

    - name: Configure CMake
      shell: pwsh
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Debug --target hypertube unit_tests config_tests search_tests torrent_tests slint_model_tests slint_controller_tests slint-preview-check --parallel 2

    - name: Test
      run: ctest --test-dir build -C Debug --output-on-failure
