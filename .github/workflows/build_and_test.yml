name: Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtorrent-rasterbar-dev libcurl4-openssl-dev libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev nlohmann-json3-dev xvfb

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHYPERTUBE_ENABLE_SLINT_GPU_BENCHMARK=ON

    - name: Build
      run: cmake --build build --target hypertube unit_tests config_tests search_tests torrent_tests slint_model_tests slint_controller_tests slint-preview-check -j2

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Generate Slint visual snapshots
      run: xvfb-run -a cmake --build build --target slint-visual-snapshots-run -j2

    - name: Compare Slint renderers
      run: xvfb-run -a cmake --build build --target slint-renderer-comparison -j2

    - name: Upload Slint visual snapshots
      uses: actions/upload-artifact@v4
      with:
        name: slint-visual-snapshots
        path: build/visual-artifacts/*.bmp

    - name: Upload renderer benchmark reports
      uses: actions/upload-artifact@v4
      with:
        name: slint-renderer-reports
        path: build/renderer-reports/*.json

  macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: brew install boost libtorrent-rasterbar curl nlohmann-json pkg-config

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --target hypertube unit_tests config_tests search_tests torrent_tests slint_model_tests slint_controller_tests slint-preview-check -j2

    - name: Test
      run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: pwsh
      run: vcpkg install libtorrent curl nlohmann-json --triplet x64-windows

    - name: Configure CMake
      shell: pwsh
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Debug --target hypertube unit_tests config_tests search_tests torrent_tests slint_model_tests slint_controller_tests slint-preview-check --parallel 2

    - name: Test
      run: ctest --test-dir build -C Debug --output-on-failure
