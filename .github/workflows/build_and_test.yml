name: Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtorrent-rasterbar-dev libcurl4-openssl-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev libglu1-mesa-dev libglfw3-dev nlohmann-json3-dev

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build -j2

    - name: Test
      run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: brew install boost libtorrent-rasterbar curl glfw nlohmann-json

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build -j2

    - name: Test
      run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      shell: pwsh
      run: vcpkg install glfw3 libtorrent curl nlohmann-json --triplet x64-windows

    - name: Configure CMake
      shell: pwsh
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Debug --parallel 2

    - name: Test
      run: ctest --test-dir build -C Debug --output-on-failure
